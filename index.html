<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="How to get started with Backlink Monitoring Tool in Chrome.">
  <title>Backlink Monitoring Tool Installed</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="page-header">
      <img src="icon.png" alt="" width="56" height="56">
      <h1>Backlink Monitoring Tool Installed</h1>
    </header>
    <section class="step" aria-label="Pin the extension">
      <p>Click the puzzle piece <strong>(1)</strong> in Chrome's toolbar. Then click the pin <strong>(2)</strong> next to Backlink Monitoring Tool.</p>
      <figure class="figure-pin"><img src="step-pin.png" alt="In Chrome, click the outlined puzzle icon marked 1, then pin Backlink Monitoring Tool using the pin marked 2." width="1672" height="941"></figure>
    </section>
    <section class="step" aria-label="Open the extension">
      <p>On any webpage, click the Backlink Monitoring Tool icon <strong>(3)</strong> in Chrome's toolbar to open the extension.</p>
      <figure class="figure-open"><img src="step-open-3.png" alt="On a schematic webpage, click the Backlink Monitoring Tool icon marked 3 in Chrome's toolbar." width="1672" height="941"></figure>
    </section>
  </main>
</body>
</html>
