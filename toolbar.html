<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Get started with Backlink Monitoring Tool in Chrome.">
  <title>Backlink Monitoring Tool Installed</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="page-header">
      <img src="icon.png" alt="" width="56" height="56">
      <h1>Backlink Monitoring Tool Installed</h1>
    </header>
<section class="step" aria-label="Monitor and manage links">
  <p>Right-click any link and choose <strong>“Monitor this link” (1)</strong> to add it to monitoring. Then click the Backlink Monitoring Tool icon <strong>(2)</strong> in Chrome's toolbar to view and manage your monitored links.</p>
  <figure class="figure-monitor">
    <img src="step-monitor-1-2.png" width="1672" height="941" alt="Right-click a webpage link and choose Monitor this link, highlighted in red as step 1; click the Backlink Monitoring Tool icon in Chrome's toolbar, marked 2, to manage monitored links.">
  </figure>
</section>
  </main>
</body>
</html>
